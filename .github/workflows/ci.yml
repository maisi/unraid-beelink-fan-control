name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Controller tests
        run: python3 -m unittest -v
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: JavaScript checks and simulated browser tests
        run: |
          npm run check
          npm test
      - name: Validate PHP files
        run: |
          php -l api.php
          php -l BeelinkFans.Dashboard.page
      - name: Rebuild distributable
        run: |
          python3 build.py
          git diff --exit-code -- dist/beelink-fan-control.plg
